# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Security advisories from the RustSec database fail the build.
ignore = []

[licenses]
# Only licenses listed here are accepted. Everything else, including all
# copyleft licenses (GPL, LGPL, AGPL, MPL, EUPL, ...), is denied.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The allowlist is policy, not a record of current dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
